<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administración - AeroPlata</title>
    <link rel="stylesheet" href="adm.css">
</head>
<body>
    <header>
        <img src="img/logo-AeroPlata.jpg" alt="Logo-AeroPlata" class="logo">
        <h1>Panel del Jefe de Ventas / Administrador</h1>
        <nav>
            <a href="VerProductos.html"><button>Ver productos</button></a>
            <a href="GestionarPedidos.html"><button>Gestionar Pedidos</button></a>
            <a href="EstadoDeCuentas.html"><button>Estado de Cuentas</button></a>
            <button id="btn-logout" style="background-color: #d9534f; color: white;">Cerrar sesión</button>
        </nav>
    </header>

    <main>
        <!-- Sección de cargar productos (Alta de Paquetes) -->
        <section id="seccion-productos" class="panel-seccion">
            <h2>Alta de productos (Paquetes / Servicios)</h2>
            <form id="form-producto">
                <input type="text" id="codigo" placeholder="Código de paquete (ej: PAC-001)" required>
                <input type="text" id="tipo_paquete" placeholder="Tipo de paquete" required>
                <input type="text" id="titulo" placeholder="Título del paquete" required>
                <input type="text" id="descripcion" placeholder="Descripción detallada" required>
                <input type="number" step="0.01" id="precio_total" placeholder="Precio total" required>
                <input type="number" id="cantidad_noches" placeholder="Cantidad de noches" required>
                
                <!-- IDs de relaciones requeridos por el backend -->
                <input type="number" id="id_ubicacion_destino" placeholder="ID Ubicación Destino" required>
                <input type="number" id="id_hotel" placeholder="ID Hotel" required>
                <input type="number" id="id_vuelo" placeholder="ID Vuelo" required>
                <input type="number" id="id_seguro_medico" placeholder="ID Seguro Médico" required>
                
                <button type="submit">Guardar producto</button>
            </form>
            <p id="mensaje-respuesta" style="margin-top: 10px; font-weight: bold;"></p>
        </section>
    </main>

    <script>
        // URL de tu backend desplegado en Render
        const API_URL = "https://aeroplate-backend.onrender.com"; 

        // Verificar si el usuario está logueado leyendo la clave correcta ('token') y aceptando el rol 'ventas'
        const token = localStorage.getItem("token");
        const rol = localStorage.getItem("rol");

        if (!rol || (rol !== "admin" && rol !== "jefe_ventas" && rol !== "ventas")) {
            alert("Acceso no autorizado. Inicia sesión como administrador.");
            window.location.href = "login.html";
        }

        // Manejar el envío del formulario para crear un paquete
        document.getElementById("form-producto").addEventListener("submit", async (e) => {
            e.preventDefault();

            const datosPaquete = {
                codigo_paquete: document.getElementById("codigo").value,
                tipo_paquete: document.getElementById("tipo_paquete").value,
                titulo: document.getElementById("titulo").value,
                descripcion: document.getElementById("descripcion").value,
                precio_total: parseFloat(document.getElementById("precio_total").value),
                cantidad_noches: parseInt(document.getElementById("cantidad_noches").value),
                id_ubicacion_destino: parseInt(document.getElementById("id_ubicacion_destino").value),
                id_hotel: parseInt(document.getElementById("id_hotel").value),
                id_vuelo: parseInt(document.getElementById("id_vuelo").value),
                id_seguro_medico: parseInt(document.getElementById("id_seguro_medico").value)
            };

            const mensajeP = document.getElementById("mensaje-respuesta");

            try {
                const respuesta = await fetch(`${API_URL}/paquetes`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(datosPaquete)
                });

                if (respuesta.ok) {
                    mensajeP.style.color = "green";
                    mensajeP.textContent = "¡Paquete creado con éxito!";
                    document.getElementById("form-producto").reset();
                } else {
                    const errorData = await respuesta.json();
                    mensajeP.style.color = "red";
                    // Limpiamos la visualización del error por si viene en formato de lista u objeto
                    const detalleError = Array.isArray(errorData.detail) 
                        ? errorData.detail.map(err => `${err.loc.join('.')}: ${err.msg}`).join(', ') 
                        : (errorData.detail || "No se pudo guardar el paquete");
                    mensajeP.textContent = `Error: ${detalleError}`;
                }
            } catch (error) {
                console.error("Error de conexión:", error);
                mensajeP.style.color = "red";
                mensajeP.textContent = "Error de conexión con el servidor.";
            }
        });

        // Botón para cerrar sesión
        document.getElementById("btn-logout").addEventListener("click", () => {
            localStorage.removeItem("token");
            localStorage.removeItem("rol");
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
