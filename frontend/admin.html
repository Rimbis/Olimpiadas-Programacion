<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administración - AeroPlate</title>
    <link rel="stylesheet" href="adm.css">
</head>
<body>
    <header>
        <img src="img/Logo-AeroPlate.jpg" alt="Logo-AeroPlate" class="logo">
        <h1>Panel del Jefe de Ventas / Administrador</h1>

        <nav>
            <!-- Funciones para la muestra y gestión de productos -->
            <a href="VerProductos.html"><button onclick="mostrarSeccion('productos')">Ver productos</button></a>
            <a href="GestionarPedidos.html"><button onclick="mostrarSeccion('pedidos')">Gestionar Pedidos</button></a>
            <a href="EstadoDeCuentas.html"><button onclick="mostrarSeccion('cuentas')">Estado de Cuentas</button></a>
        </nav>
    </header>

    <main>
        <!-- Seccion de cargar productos -->
        <section id="seccion-productos" class="panel-seccion">
            <h2>Alta de productos (Paquetes / Servicios)</h2>
            <form id="form-producto">
                <input type="text" id="codigo" placeholder="Código de producto" required>
                <input type="text" id="descripcion" placeholder="Descripción" required>
                <input type="number" id="precio" placeholder="Precio" required>
                <button type="submit">Guardar producto</button>
            </form>
        </section>

        <!-- Segunda sección de gestión de pedidos pendientes -->
        <section id="seccion-pedidos" class="panel-seccion" style="display: none;">
            <h2>Pedidos Pendientes y Entregas</h2>
            <div id="lista-pedidos">
                <!-- Esto lo cargamos directamente desde el backend -->
            </div>
        </section>

        <!-- Tercera sección de Estado de cuenta -->
        <section id="seccion-cuentas" class="panel-seccion" style="display: none;">
            <h2>Estado de Cuentas y Facturas</h2>
            <div id="info-cuentas">
                <!-- Datos ordenados por fecha y cliente -->
            </div>
        </section>
    </main>

    <!-- Scripts para la seguridad, lógica de la vista y conexión con la API -->
    <script src="api.js"></script>
    <script>
        // Verificación de seguridad: si no es admin o jefe de ventas, no lo dejamos pasar
        if (!esAdmin()) {
            alert("Acceso no autorizado. Inicia sesión como administrador.");
            window.location.href = "login.html";
        }
    </script>
    <script src="admin.js"></script>
    
</body>
</html>
