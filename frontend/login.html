<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login web</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="contenedor">
        <!-- Formulario de Inicio de Sesión -->
        <form class="formulario" id="formularioInicioSesion">
            <h1 class="tituloI">Inicio</h1>
            <div class="campo">
                <input type="email" name="correoElectronico" class="entrada" placeholder="email" required>
            </div>
            <div class="campo">
                <input type="password" name="contra" class="entrada" placeholder="contraseña" required>
            </div>
            <p class="mensaje" id="errorLogin" role="alert" style="color:#c0392b;"></p>
            <button type="submit" class="boton">Iniciar sesión</button>
            <div class="pie">
                ¿No tienes cuenta? <span class="enlace" onclick="mostrarRegistro()">Regístrate</span>
            </div>
        </form>

        <!-- Formulario de Registro -->
        <form class="formulario oculto" id="formularioRegistro">
            <h1 class="tituloR">Registro</h1>
            <div class="campo">
                <input type="text" name="nombre" class="entrada" placeholder="nombre" maxlength="100" required>
            </div>
            <div class="campo">
                <input type="text" name="apellido" class="entrada" placeholder="apellido" maxlength="100" required>
            </div>
            <div class="campo">
                <input type="email" name="correoElectronico" class="entrada" placeholder="email" required>
            </div>
            <div class="campo">
                <input type="password" name="contra" class="entrada" placeholder="contraseña (mínimo 6)"
                    minlength="6" maxlength="72" required>
            </div>
            <p class="mensaje" id="errorRegistro" role="alert" style="color:#c0392b;"></p>
            <button type="submit" class="boton">Registrarse</button>
            <div class="pie">
                ¿Ya tienes cuenta? <span class="enlace" onclick="mostrarInicioSesion()">Inicia sesión</span>
            </div>
        </form>
    </div>

    <script src="api.js"></script>
    <script>
        function mostrarRegistro() {
            document.getElementById('formularioInicioSesion').classList.add('oculto');
            document.getElementById('formularioRegistro').classList.remove('oculto');
        }

        function mostrarInicioSesion() {
            document.getElementById('formularioRegistro').classList.add('oculto');
            document.getElementById('formularioInicioSesion').classList.remove('oculto');
        }

        // Si ya hay sesión iniciada, no tiene sentido permanecer en el login
        if (getToken()) window.location.href = 'index.html';

        // INICIO DE SESIÓN
        document.getElementById('formularioInicioSesion').addEventListener('submit', async function (evento) {
            evento.preventDefault();
            const error = document.getElementById('errorLogin');
            const boton = this.querySelector('button[type="submit"]');
            error.textContent = '';
            boton.disabled = true;

            try {
                await login(this.correoElectronico.value.trim(), this.contra.value);
                window.location.href = 'index.html';
            } catch (e) {
                error.textContent = e.message;
                boton.disabled = false;
            }
        });

        // REGISTRO (crea la cuenta y deja la sesión iniciada)
        document.getElementById('formularioRegistro').addEventListener('submit', async function (evento) {
            evento.preventDefault();
            const error = document.getElementById('errorRegistro');
            const boton = this.querySelector('button[type="submit"]');
            error.textContent = '';
            boton.disabled = true;

            const email = this.correoElectronico.value.trim();
            const password = this.contra.value;

            try {
                await registrar({
                    nombre: this.nombre.value.trim(),
                    apellido: this.apellido.value.trim(),
                    email,
                    password,
                });
                await login(email, password);
                window.location.href = 'index.html';
            } catch (e) {
                error.textContent = e.message;
                boton.disabled = false;
            }
        });
    </script>
</body>

</html>
