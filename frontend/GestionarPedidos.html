<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Pedidos - AeroPlata</title>
    <link rel="stylesheet" href="adm.css">
    <style>
        .tabla-pedidos {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .tabla-pedidos th,
        .tabla-pedidos td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        .tabla-pedidos th {
            background-color: #f4f4f4;
            color: #333;
        }

        .mensaje-info {
            margin-top: 20px;
            font-weight: bold;
        }

        .btn-cancelar {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-cancelar:hover {
            background-color: #c9302c;
        }
    </style>
</head>

<body>
    <header>
        <h1>Panel de Jefe de Ventas : Gestionar Pedidos</h1>
        <nav>
            <a href="admin.html"><button>Alta de productos</button></a>
            <a href="VerProductos.html"><button>Ver productos</button></a>
            <a href="EstadoDeCuentas.html"><button>Estado de Cuentas</button></a>
            <button id="btn-logout" style="background-color: #d9534f; color: white;">Cerrar sesión</button>
        </nav>
    </header>

    <main style="padding: 20px;">

        <div class="ayuda-container">
            <button class="ayuda">?</button>
            <div class="texto-ayuda oculto">
                Muestra los pedidos aun no entregados. Entre a un pedido para entregarlo o anularlo.
            </div>
        </div>
        <script>
            // Seleccionamos el botón y el texto
            const botonAyuda = document.querySelector('.ayuda');
            const textoAyuda = document.querySelector('.texto-ayuda');

            botonAyuda.addEventListener('click', () => {
                textoAyuda.classList.toggle('oculto');
            });
        </script>

        <h2>Listado de Pedidos y Compras de Clientes</h2>
        <p id="mensaje-estado" class="mensaje-info">Cargando pedidos...</p>

        <table class="tabla-pedidos" id="tabla-pedidos" style="display: none;">
            <thead>
                <tr>
                    <th>ID Compra</th>
                    <th>Usuario</th>
                    <th>Paquete</th>
                    <th>Detalles / Fecha</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla-pedidos">
                <!-- Los pedidos se cargarán dinámicamente -->
            </tbody>
        </table>
    </main>

    <script>
        const API_URL = "https://aeroplate-backend.onrender.com";

        // Verificar sesión y rol
        const token = localStorage.getItem("token");
        const rol = localStorage.getItem("rol");

        if (!rol || (rol !== "admin" && rol !== "jefe_ventas" && rol !== "ventas")) {
            alert("Acceso no autorizado. Inicia sesión como administrador.");
            window.location.href = "login.html";
        }

        async function cargarPedidos() {
            const mensajeEstado = document.getElementById("mensaje-estado");
            const tablaPedidos = document.getElementById("tabla-pedidos");
            const cuerpoTabla = document.getElementById("cuerpo-tabla-pedidos");

            try {
                const respuesta = await fetch(`${API_URL}/compras/admin/todas`, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (respuesta.ok) {
                    const pedidos = await respuesta.json();

                    if (pedidos.length === 0) {
                        mensajeEstado.textContent = "No hay pedidos registrados en el sistema.";
                        return;
                    }

                    mensajeEstado.style.display = "none";
                    tablaPedidos.style.display = "table";
                    cuerpoTabla.innerHTML = "";

                    pedidos.forEach(p => {
                        const compraId = p.id || p.id_compra;
                        const fila = document.createElement("tr");
                        fila.innerHTML = `
                            <td>${compraId || '-'}</td>
                            <td>${p.id_cliente || p.usuario || '-'}</td>
                            <td>${p.id_paquete || '-'}</td>
                            <td>${p.fecha || p.fecha_compra || '-'}</td>
                            <td>${p.estado || 'Registrado'}</td>
                            <td>
                                <button class="btn-cancelar" onclick="cancelarPedidoAdmin(${compraId})">Cancelar</button>
                            </td>
                        `;
                        cuerpoTabla.appendChild(fila);
                    });
                } else {
                    mensajeEstado.style.color = "red";
                    mensajeEstado.textContent = "Error al obtener los pedidos del servidor.";
                }
            } catch (error) {
                console.error("Error de conexión:", error);
                mensajeEstado.style.color = "red";
                mensajeEstado.textContent = "Error de conexión al intentar cargar los pedidos.";
            }
        }

        async function cancelarPedidoAdmin(idCompra) {
            if (!confirm(`¿Estás seguro de que deseas cancelar la compra #${idCompra}?`)) {
                return;
            }

            try {
                const respuesta = await fetch(`${API_URL}/compras/admin/${idCompra}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (respuesta.ok) {
                    alert("Pedido cancelado correctamente.");
                    cargarPedidos(); // Recargar la tabla
                } else {
                    const errorData = await respuesta.json();
                    alert("Error al cancelar: " + (errorData.detail || "No se pudo procesar"));
                }
            } catch (error) {
                console.error("Error de red:", error);
                alert("Error de conexión al intentar cancelar el pedido.");
            }
        }

        cargarPedidos();

        // Botón para cerrar sesión
        document.getElementById("btn-logout").addEventListener("click", () => {
            localStorage.removeItem("token");
            localStorage.removeItem("rol");
            window.location.href = "login.html";
        });
    </script>
</body>

</html>
