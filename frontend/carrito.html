<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito - AeroPlate</title>
    <link rel="stylesheet" href="index.css" />
    <style> /* Para no confundir, esto es especifico de Carrito */
        main.carro { max-width: 900px; margin: 1rem auto; padding: 0 1rem; }
        .item { border: 1px solid #2b7a9b; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        .pasajero { border-top: 1px dashed #aaa; padding: .6rem 0; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
        .pasajero input, .pasajero select { padding: .3rem; width: 130px; }
        .pasajero input.corto { width: 70px; }
        .acciones { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .6rem; }
        .error { color: #c0392b; }
        .ok { color: #2e7d32; }
    </style>
</head>

<body>
    <header class="encabezado">
        <img src="img/Logo-AeroPlate.jpg" alt="Logo-AeroPlate" class="logo">
        <h1>AeroPlate</h1>
        <div class="opciones">
            <a href="index.html" class="btnLink">Seguir viendo paquetes</a>
        </div>
    </header>

    <main class="carro">
        <h2>Carrito</h2>
        <p id="aviso"></p>
        <div id="items"></div>
    </main>

    <script src="api.js"></script>
    <script>
        const cont = document.getElementById("items");
        const aviso = document.getElementById("aviso");
        let carrito = getCarrito();

        const pasajeroVacio = () => ({
            nombre: "", apellido: "", dni: "", tipo_pasajero: "adulto",
            condiciones_medicas: false, descripcion_medica: "", fila: "", letra: "",
        });

        function el(tag, props = {}, ...hijos) {
            const e = Object.assign(document.createElement(tag), props);
            e.append(...hijos);
            return e;
        }

        // Input enlazado a un dato del pasajero: guarda en el navegador al escribir
        function campo(p, clave, props) {
            return el("input", {
                ...props,
                value: p[clave],
                oninput: (ev) => { p[clave] = ev.target.value; guardarCarrito(carrito); },
            });
        }

        function filaPasajero(it, p, render) {
            const desc = campo(p, "descripcion_medica", { placeholder: "Describí la condición médica", hidden: !p.condiciones_medicas });
            const check = el("input", {
                type: "checkbox", checked: p.condiciones_medicas,
                onchange: (ev) => { p.condiciones_medicas = ev.target.checked; desc.hidden = !ev.target.checked; guardarCarrito(carrito); },
            });
            const tipo = el("select", { onchange: (ev) => { p.tipo_pasajero = ev.target.value; guardarCarrito(carrito); } },
                el("option", { value: "adulto", textContent: "Adulto" }),
                el("option", { value: "menor", textContent: "Menor" }));
            tipo.value = p.tipo_pasajero;

            const fila = el("div", { className: "pasajero" },
                campo(p, "nombre", { placeholder: "Nombre", maxLength: 100 }),
                campo(p, "apellido", { placeholder: "Apellido", maxLength: 100 }),
                campo(p, "dni", { placeholder: "DNI", type: "number", min: 1 }),
                tipo,
                campo(p, "fila", { placeholder: "Fila", type: "number", min: 1, className: "corto" }),
                campo(p, "letra", { placeholder: "Letra", maxLength: 1, className: "corto" }),
                el("label", {}, check, " Cond. médica"),
                desc);
            if (it.pasajeros.length > 1) {
                fila.append(el("button", {
                    type: "button", textContent: "Quitar",
                    onclick: () => { it.pasajeros = it.pasajeros.filter((x) => x !== p); guardarCarrito(carrito); render(); },
                }));
            }
            return fila;
        }

        async function confirmar(it, msg, btn) {
            msg.textContent = "";
            const pas = it.pasajeros.map((p) => ({
                nombre: p.nombre.trim(), apellido: p.apellido.trim(), dni: Number(p.dni),
                tipo_pasajero: p.tipo_pasajero, condiciones_medicas: p.condiciones_medicas,
                descripcion_medica: p.condiciones_medicas ? p.descripcion_medica.trim() : null,
                fila: Number(p.fila), letra: String(p.letra).trim().toUpperCase(),
            }));
            const incompleto = pas.some((p) => !p.nombre || !p.apellido || !(p.dni > 0) || !(p.fila > 0)
                || !/^[A-Z]$/.test(p.letra) || (p.condiciones_medicas && !p.descripcion_medica));
            if (incompleto) {
                msg.textContent = "Completá los datos de cada pasajero (DNI, fila, letra y descripción médica si corresponde).";
                return;
            }
            btn.disabled = true;
            try {
                await crearCompra({ id_paquete: it.id, pasajeros: pas });
                carrito = carrito.filter((x) => x !== it);
                guardarCarrito(carrito);
                render();
                aviso.className = "ok";
                aviso.textContent = "¡Compra creada! Pendiente: tenés 15 minutos para pagarla.";
            } catch (e) {
                msg.textContent = e.message;
                btn.disabled = false;
            }
        }

        function render() {
            cont.replaceChildren();
            aviso.className = "";
            aviso.textContent = "";

            if (!getToken()) {
                aviso.replaceChildren("Iniciá sesión para comprar. ", el("a", { href: "login.html", textContent: "Iniciar sesión" }));
                return;
            }
            if (esAdmin()) { aviso.textContent = "El personal interno no puede realizar compras."; return; }
            if (!carrito.length) {
                aviso.textContent = "Tu carrito está vacío. Elegí paquetes en «Paquetes turísticos».";
                return;
            }

            carrito.forEach((it) => {
                if (!it.pasajeros.length) it.pasajeros.push(pasajeroVacio());

                const subtotal = el("strong");
                const pintarSubtotal = () => {
                    subtotal.textContent = `Subtotal estimado: $${(Number(it.precio_total) * it.pasajeros.length).toLocaleString("es-AR")}`;
                };
                pintarSubtotal();

                const msg = el("p", { className: "error" });
                const btnConfirmar = el("button", { type: "button", className: "boton", textContent: "Confirmar compra" });
                btnConfirmar.onclick = () => confirmar(it, msg, btnConfirmar);

                const acciones = el("div", { className: "acciones" },
                    el("button", {
                        type: "button", textContent: "+ Pasajero",
                        onclick: () => { if (it.pasajeros.length < 9) { it.pasajeros.push(pasajeroVacio()); guardarCarrito(carrito); render(); } },
                    }),
                    el("button", {
                        type: "button", textContent: "Quitar del carrito",
                        onclick: () => { carrito = carrito.filter((x) => x !== it); guardarCarrito(carrito); render(); },
                    }),
                    btnConfirmar);

                cont.append(el("section", { className: "item" },
                    el("h3", { textContent: it.titulo }),
                    el("small", { textContent: `${it.cantidad_noches} noches · $${it.precio_total} por pasajero` }),
                    ...it.pasajeros.map((p) => filaPasajero(it, p, render)),
                    el("p", {}, subtotal),
                    msg, acciones));
            });
        }

        render();
    </script>
</body>

</html>
